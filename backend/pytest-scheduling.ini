# P2-T09 — dedicated pytest config that enforces the >=85% coverage gate on
# `backend/scheduling/` (algorithm-engineer's correctness-critical package),
# separately from the backend-wide >=70% gate in pyproject.toml's
# [tool.pytest.ini_options] addopts.
#
# Run from `backend/`:   python -m pytest -c pytest-scheduling.ini
# Or via:                make test-scheduling   (from the repo root)
#
# The default `pytest` run still collects tests/scheduling/ too (they live
# under testpaths=["tests"]); this config exists only to measure + gate the
# scheduling package's own line coverage. [tool.coverage.*] in pyproject.toml
# (omit of scheduling/_selftest*.py, exclude_also of __main__ blocks) applies
# to this run as well.
[pytest]
asyncio_mode = auto
testpaths = tests/scheduling
addopts = --cov=scheduling --cov-report=term-missing --cov-fail-under=85 --no-cov-on-fail
