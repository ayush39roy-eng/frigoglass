# Root reverse-proxy config for the top-level `nginx` Docker Compose
# service (`../../docker-compose.yml`) — the ONLY container in the
# production stack that publishes ports to the host (80 + 443). Routes:
#   /api/*   -> `waf-api` (ModSecurity + OWASP CRS in front of `api`),
#               `/api` prefix stripped
#   /healthz -> `api` service directly (container/orchestrator health probe
#               — deliberately bypasses the WAF hop, see note below)
#   /*       -> `waf-frontend` (ModSecurity + OWASP CRS in front of
#               `frontend`, the built static SPA — see
#               `../../frontend/nginx.conf`)
#
# TLS termination, HSTS, and the baseline security headers below are this
# task's own addition (P6-T02). ModSecurity/OWASP CRS itself does NOT run in
# this container — it runs in the two dedicated `waf-api`/`waf-frontend`
# Compose services this task also adds (see docker-compose.yml), which sit
# between this edge nginx and `api`/`frontend`. Splitting it this way keeps
# this file's job to exactly what P6-T01 already built (TLS/HSTS/headers/
# routing/SSE-buffering) plus a one-line upstream-name change, rather than
# hand-rolling a from-scratch ModSecurity nginx build here — the official
# `owasp/modsecurity-crs` image already ships a maintained, compiled-in
# ModSecurity-nginx connector + OWASP CRS, and its default single-BACKEND
# reverse-proxy mode is a perfect fit for one WAF instance per upstream.
#
# `frontend/nginx.conf` (the internal-only static-file-serving container's
# OWN config) is NOT touched by this task — it stays bare HTTP, per
# P6-T01's own note that only this edge config is internet-facing.

# `resolver`-free static upstream names are fine here: Docker Compose's
# embedded DNS resolves `api`/`waf-api`/`waf-frontend` service names for the
# lifetime of the nginx process, and none of them are scaled up/down
# dynamically in this topology (see P6-T01's identical reasoning, carried
# forward unchanged for the two new WAF upstreams).
upstream api_upstream {
    server api:8000;
}

upstream waf_api_upstream {
    server waf-api:8080;
}

upstream waf_frontend_upstream {
    server waf-frontend:8080;
}

# Hides the nginx version on both the `Server` response header and nginx's
# own generated error pages. Does not hide the `nginx` product name itself
# (that would require `more_set_headers`, an extra third-party module this
# plain `nginx:1.27-alpine` image doesn't carry — the WAF hop's own image
# already ships that module and sets a minimal `Server: nginx` there;
# consistent-enough baseline hardening for this file specifically).
server_tokens off;

# Minimal CSP baseline (P6-T02). No CSP existed anywhere in this repo before
# this task (checked `frontend/index.html` and the whole `frontend/src`
# tree — no meta-tag CSP, no header-setting code) — this is a new,
# deliberately conservative policy, not a full audit (that is P6-T07's job,
# per this task's own scope note). `script-src`/`style-src` both carry
# 'unsafe-inline': `frontend/index.html` has a small inline <script> that
# sets the dark/light theme class before first paint (to avoid a flash),
# and Framer Motion / Tailwind's runtime may set inline `style` attributes
# in ways this task did not fully audit. Flagged here for P6-T07 to tighten
# to a nonce- or hash-based policy once that audit happens. No third-party
# origins are allowlisted anywhere (confirmed no CDN/external font/script
# references in `frontend/index.html` or `frontend/src`) — everything is
# same-origin ('self'), including API calls (same-origin `/api/*`, no
# cross-origin fetch target). Applied via `add_header` inside the HTTPS
# server block below (`Content-Security-Policy`) rather than a top-level
# `set $csp ...`, since `set` is only valid in server/location/if context.

# HTTP: redirect-only. Never serves content — all actual traffic uses the
# HTTPS server block below. `default_server` on the unqualified `listen 80`
# catches every Host header (there is only one vhost in this deployment).
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Internal-only healthcheck listener, never published to the host (see
# docker-compose.yml's `nginx` service — only 80/443 are published). Exists
# solely so this container's own Docker `HEALTHCHECK` can probe liveness in
# plain HTTP without needing a TLS client that trusts (or is told to skip
# verifying) whatever certificate is mounted at /etc/nginx/tls — the
# `nginx:1.27-alpine` image's busybox `wget` has no such flag (confirmed:
# `wget --help` lists no `--no-check-certificate`/`-P`-style cert-skip
# option), so probing HTTPS directly from inside the container isn't a
# realistic option here. This does NOT weaken "port 80 only redirects,
# never serves content" — 8080 is a different, unpublished port that no
# external client can ever reach.
server {
    listen 8080;
    server_name _;

    location = /healthz {
        proxy_pass http://api_upstream/healthz;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # TLS 1.3 is enabled and will always be the version negotiated by any
    # client that supports it (a TLS handshake always settles on the
    # highest mutually-supported version — there is no separate "prefer"
    # knob beyond listing it). TLS 1.2 is kept alongside it, not disabled,
    # for compatibility with any older internal tooling/monitoring probes
    # on Frigoglass's corporate network that may not yet support 1.3 (this
    # is an on-premise deployment behind a corporate network, not a public
    # site where we can assume a fully modern client population) — this
    # mirrors Mozilla's "Intermediate" TLS profile. TLS 1.0/1.1/SSLv3 are
    # never offered.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Cipher list applies to TLS 1.2 only (TLS 1.3's own AEAD suite set is
    # fixed by the protocol and not configurable via `ssl_ciphers`) — AEAD,
    # forward-secret (ECDHE) suites only, per Mozilla's Intermediate profile.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # Let the client pick among the (already-curated, AEAD-only) list above
    # rather than forcing nginx's own order — current Mozilla guidance for
    # the Intermediate profile now that all offered ciphers are strong.
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 25m;

    # --- Baseline security headers (P6-T02) ---
    # `always` so these are also sent on error responses (4xx/5xx), which
    # nginx otherwise suppresses `add_header` on by default.
    #
    # max-age=31536000 (1 year) + includeSubDomains, but deliberately NO
    # `preload`: HSTS preload is designed for public internet domains that
    # get baked into browser preload lists (Chrome's HSTS preload list,
    # shipped in the browser binary itself) — submission is intended to be
    # effectively permanent and is meant for domains the public internet
    # resolves to. This is an on-premise app behind Frigoglass's corporate
    # network with no public DNS presence to preload in the first place,
    # and an accidental/premature preload submission on an internal-only
    # hostname is very hard to reverse. `includeSubDomains` alone (without
    # preload) already gives strong protection for this deployment.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Direct pass-through (no `/api` prefix), and deliberately BYPASSES the
    # `waf-api` hop: this is a liveness/readiness probe used by container
    # orchestration and the P6-T01 acceptance criteria (`curl .../healthz`),
    # not a piece of the WAF-guarded internet-facing application surface —
    # it takes no user input and returns a fixed shape. Routing it straight
    # to `api` keeps health-check semantics meaningful (it reflects `api`'s
    # own real health, not a synthetic "OK" from the WAF image's own stub
    # `/healthz` location) without spending a WAF hop's latency/blocking
    # risk on every orchestrator probe.
    location = /healthz {
        proxy_pass http://api_upstream/healthz;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://waf_api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Solver-progress SSE (`GET /schedule-runs/{id}/progress`,
        # `workers/progress.py`) is a long-lived streamed response —
        # buffering it would hold the whole stream in nginx until it closes,
        # defeating the point of a progress stream. `proxy_read_timeout` is
        # raised well past nginx's 60s default for the same reason (a CP-SAT
        # solve can run up to `RPD_CELERY_CP_SAT_MAX_TIME_IN_SECONDS`, see
        # `core/celery_config.py`). The `waf-api` hop in front of `api`
        # already sets `proxy_buffering off` + a 36000s read timeout on its
        # own side by default (verified against the upstream image's
        # `includes/proxy_backend.conf.template`) — these settings here
        # cover this leg of the same end-to-end stream.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://waf_frontend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
