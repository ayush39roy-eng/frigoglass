    <script>
      // Set the theme class before first paint to avoid a flash. Mirrors the logic in
      // src/components/theme/theme-provider.tsx (kept deliberately tiny and dependency-free).
      (function () {
        try {
          var stored = localStorage.getItem('rpd-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = stored === 'light' || stored === 'dark' ? stored : system;
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* localStorage unavailable — fall back to the CSS default (light) */
        }
      })();
    </script>
