# Static-file server for the built React SPA (see `Dockerfile`). Consumed
# ONLY by the root reverse-proxy `nginx` Compose service
# (`../deploy/nginx/default.conf`'s `proxy_pass http://frontend:80/;`) — this
# container is never exposed to the host directly.
#
# `try_files ... /index.html` is required for client-side routing
# (react-router `BrowserRouter` — see `src/App.tsx`'s routes: `/dashboard`,
# `/capacity`, `/matrix`, `/gantt`, `/planning`, ...): a hard browser refresh
# on any non-root path must still serve `index.html` (which then lets
# react-router resolve the path client-side), not nginx's default 404 for a
# path with no matching file on disk.
#
# TLS/HSTS/security headers are explicitly OUT of scope here — P6-T02 owns
# the reverse-proxy edge's TLS termination and security headers; this
# internal-only static server deliberately stays a bare HTTP config per this
# task's own "leave clean seams" instruction.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets are content-hashed by Vite (see `dist/assets/*-<hash>.js`)
    # — safe to cache aggressively. `index.html` itself is NOT matched by
    # this location block (it has no file extension) and keeps nginx's
    # default (no long-lived cache), so a new deploy is always picked up.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
