::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C4D0E4;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#A8B8D4}
.app{font-family:var(--ui);color:var(--t1);min-height:100vh;font-size:12px;
  background:
    radial-gradient(900px 500px at 85% -8%, rgba(18,165,221,.08), transparent 60%),
    radial-gradient(800px 520px at -10% 110%, rgba(79,107,232,.06), transparent 55%),
    repeating-linear-gradient(0deg, rgba(18,38,71,.03) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(18,38,71,.03) 0 1px, transparent 1px 44px),
    var(--bg);}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.disp{font-family:var(--disp);letter-spacing:-.3px}
.lbl{font-size:9.5px;letter-spacing:1.3px;color:var(--t3);font-weight:700;text-transform:uppercase;font-family:var(--ui)}
.hero{background:var(--glacier);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:0 1px 2px rgba(18,38,71,.05),0 10px 26px rgba(18,38,71,.05)}
.card.tight{padding:10px 14px}
.btn{background:var(--panel);color:var(--t2);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;font-size:11px;font-weight:650;cursor:pointer;font-family:var(--ui);
  transition:border-color .15s,color .15s,background .15s,transform .08s;white-space:nowrap}
.btn:hover{border-color:var(--line2);color:var(--t1);background:#F0F4FB}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,#2E6BFF,#2650C9);border-color:rgba(122,165,255,.55);color:#fff;
  box-shadow:0 2px 14px rgba(46,107,255,.28)}
.btn.pri:hover{background:linear-gradient(135deg,#3E79FF,#2E5CE0)}
.btn.on{background:rgba(18,165,221,.10);border-color:rgba(8,145,178,.5);color:#0E7490}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{font-size:11.5px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:#FFFFFF;
  color:var(--t1);font-family:var(--ui);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:rgba(8,145,178,.55);box-shadow:0 0 0 3px rgba(18,165,221,.14)}
.inp::placeholder{color:var(--t3)}
select.inp option{background:#FFFFFF;color:var(--t1)}
.tbl{border-collapse:collapse;width:100%}
.tbl th{text-align:left;padding:7px 10px;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--t3);
  background:#EEF3FA;white-space:nowrap;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:6px 10px;font-size:11.5px;border-bottom:1px solid rgba(18,38,71,.07);white-space:nowrap;color:var(--t1)}
.tbl tr.rowh{transition:background .12s}
.tbl tr.rowh:hover td{background:rgba(18,165,221,.06)}
.chip{border-radius:999px;padding:1.5px 8px;font-size:9.5px;font-weight:700;display:inline-block;letter-spacing:.2px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(18,38,71,.06);transition:transform .13s,border-color .13s,box-shadow .13s}
.kcard:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:0 6px 18px rgba(18,38,71,.13)}
.navb{background:transparent;color:var(--t3);border:none;padding:14px 9px 12px;font-size:11px;font-weight:650;
  cursor:pointer;position:relative;font-family:var(--ui);letter-spacing:.1px;transition:color .15s}
.navb:hover{color:var(--t1)}
.navb.on{color:var(--t1)}
.navb.on::after{content:'';position:absolute;left:9px;right:9px;bottom:0;height:2px;border-radius:2px;background:var(--glacier);
  box-shadow:0 0 10px rgba(18,165,221,.45)}
.fade{animation:fadeUp .28s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes scan{0%,100%{opacity:.85}50%{opacity:.45}}
.scanline{animation:scan 2.2s ease-in-out infinite}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.toast{animation:toastIn .22s cubic-bezier(.2,.7,.3,1)}
.tick{transition:background .15s,box-shadow .15s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
